[build-system]
requires = ["setuptools>=45"]
build-backend = "setuptools.build_meta"

# rclpy and the ROS message packages come from the ROS 2 Foxy workspaces on the
# robot, not from pip, so they are not listed. docs/setup.md.
[project]
name = "lite3-sdk-uia"
version = "0.1.0"
description = "Python SDK for the DEEP Robotics Lite3 Pro (ROS 2 Foxy)"
requires-python = ">=3.8"

[tool.setuptools]
packages = ["lite3"]
